<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    if (location.hostname === "matslb.github.io") {
      location.replace("https://ironhold-game.web.app/" + location.search + location.hash);
    }
  </script>
  <title>Ironhold</title>
  <link rel="stylesheet" href="styles/app.css">
</head>
<body>
  <div id="game"></div>

  <div id="hud" aria-live="polite">
    <div class="topbar">
      <section class="status panel" id="statusPanel" aria-label="Knight status">
        <div class="title-row">
          <div class="mark"><span class="crest"></span><span id="classLabel">Knight</span></div>
          <div class="wave-pill" id="waveLabel">Wave 1</div>
        </div>
        <div class="meter-group">
          <div class="meter-row">
            <span>HP</span>
            <div class="meter"><span id="healthFill"></span></div>
            <span id="healthText">100</span>
          </div>
          <div class="meter-row">
            <span id="resourceLabel">Guard</span>
            <div class="meter"><span id="guardFill"></span></div>
            <span id="guardText">100</span>
          </div>
        </div>
      </section>

      <div id="banner" class="panel"></div>

      <section class="rightbox panel" aria-label="Expedition status">
        <div class="readout"><span>KOs</span><strong id="koText">0</strong></div>
        <div class="readout" id="levelReadout"><span>LV</span><strong id="levelText">1</strong></div>
        <div class="readout" id="xpReadout" hidden><span>XP</span><strong id="xpText">0</strong></div>
        <div class="readout" id="kitReadout" hidden><span>Kit</span><strong id="kitText">Arming Sword</strong></div>
        <div class="save-hint" id="saveHint">Local save</div>
        <section class="quest-log" id="questLog" hidden aria-label="Active quests">
          <strong>Quests</strong>
          <div id="questLogItems"></div>
        </section>
      </section>
    </div>

    <div class="reticle"></div>

    <div class="minimap-panel" id="minimapPanel" hidden aria-label="World map">
      <canvas class="minimap-canvas" id="questMap" width="352" height="352" aria-label="World minimap with compass"></canvas>
    </div>

    <div class="talk-prompt panel" id="talkPrompt" hidden>
      <span class="talk-key" id="talkKey">E</span>
      <span id="talkAction">Talk</span>
      <strong id="talkTarget"></strong>
    </div>

    <section class="quest-dialog panel" id="questDialog" hidden aria-label="Conversation">
      <h2 id="questDialogTitle">Villager</h2>
      <p id="questDialogBody"></p>
      <p id="questDialogStatus"></p>
      <div class="quest-actions">
        <button id="questAcceptButton" class="secondary" type="button">Accept</button>
        <button id="questClaimButton" type="button">Claim Reward</button>
        <button id="questServiceButton" class="secondary" type="button">Enter Crownring</button>
        <button id="questCloseButton" class="secondary" type="button">Close</button>
      </div>
    </section>

    <div class="action-dock" aria-hidden="true">
      <div class="action" id="attackIcon">
        <svg viewBox="0 0 32 32"><path d="M22 4l6 6M18 8l6 6M4 28l6-2 15-15-4-4L6 22zM6 22l4 4"/></svg>
        <span class="keybind">LMB / Space</span>
      </div>
      <div class="action" id="blockIcon">
        <svg viewBox="0 0 32 32"><path d="M16 3l10 4v7c0 7-4 12-10 15C10 26 6 21 6 14V7z"/><path d="M16 7v17"/></svg>
        <span class="keybind">RMB / K</span>
      </div>
      <div class="action" id="potionIcon" hidden>
        <svg viewBox="0 0 32 32"><path d="M12 3h8M14 3v7l-5 8a7 7 0 0 0 6 11h2a7 7 0 0 0 6-11l-5-8V3"/><path d="M10 21h12"/></svg>
        <span class="keybind">MMB / H</span>
      </div>
    </div>

    <div id="touchControls">
      <div class="touch-pad">
        <button class="up" data-touch-key="KeyW" aria-label="Forward">^</button>
        <button class="left" data-touch-key="KeyA" aria-label="Left">&lt;</button>
        <button class="right" data-touch-key="KeyD" aria-label="Right">&gt;</button>
        <button class="down" data-touch-key="KeyS" aria-label="Back">v</button>
      </div>
      <div class="touch-actions">
        <button data-touch-action="attack" aria-label="Attack">A</button>
        <button data-touch-action="block" aria-label="Block">B</button>
        <button data-touch-action="potion" aria-label="Potion" hidden>P</button>
      </div>
    </div>
  </div>

  <div id="overlay">
    <section class="start-card panel">
      <h1>Ironhold</h1>
      <p id="overlayCopy">Start exploring, resume your local journey, or join a friend's world.</p>
      <div class="session-select" id="sessionSelect" aria-label="Session action">
        <button class="session-card" id="startSessionButton" type="button">
          <strong>Start New Session</strong>
          <span>Wipe local progress, open a new exploration room, then choose your hero.</span>
        </button>
        <button class="session-card" id="resumeGameButton" type="button" hidden>
          <strong>Resume Game</strong>
          <span id="resumeGameSummary">Continue your saved game.</span>
        </button>
        <button class="session-card" id="joinSessionButton" type="button">
          <strong>Join Session</strong>
          <span>Enter a room code and carry your progress into the host world.</span>
        </button>
      </div>
      <button class="secondary menu-back" id="backMenuButton" type="button" hidden>Back</button>
      <div class="online-panel" id="onlinePanel" hidden>
        <div class="name-entry">
          <label for="playerNameInput">Name</label>
          <input class="name-input" id="playerNameInput" maxlength="14" autocomplete="nickname" aria-label="Player name" placeholder="Player">
        </div>
        <div class="room-code-card" id="roomCodeCard" hidden>
          <span>Room Code</span>
          <strong id="roomCodeText">----</strong>
        </div>
        <div class="online-row">
          <div class="code-entry" id="joinControls">
            <input class="code-input" id="roomCodeInput" inputmode="numeric" maxlength="4" autocomplete="off" aria-label="Room code" placeholder="0000">
            <button id="joinButton" class="secondary" type="button">Join</button>
          </div>
        </div>
        <span class="online-status" id="onlineStatus">Choose start or join</span>
      </div>
      <div class="character-select" id="characterSelect" role="radiogroup" aria-label="Choose character" hidden>
        <button class="character-card selected" type="button" data-character="knight" role="radio" aria-checked="true">
          <span class="class-glyph"><svg viewBox="0 0 32 32"><path d="M16 3l10 4v7c0 7-4 12-10 15C10 26 6 21 6 14V7z"/><path d="M16 7v17"/></svg></span>
          <strong>Knight</strong>
          <span>Blade, guard, bash</span>
        </button>
        <button class="character-card" type="button" data-character="wizard" role="radio" aria-checked="false">
          <span class="class-glyph"><svg viewBox="0 0 32 32"><path d="M17 2L7 17h7l-2 13 12-17h-8z"/></svg></span>
          <strong>Wizard</strong>
          <span>Storm and potions</span>
        </button>
        <button class="character-card" type="button" data-character="ranger" role="radio" aria-checked="false">
          <span class="class-glyph"><svg viewBox="0 0 32 32"><path d="M8 24C8 13 13 8 24 8"/><path d="M8 24L24 8"/><path d="M24 8l-6 1.5M24 8l-1.5 6"/></svg></span>
          <strong>Ranger</strong>
          <span>Bow, roll, pierce</span>
        </button>
      </div>
      <div class="session-note" id="sessionNote" hidden></div>
      <div class="button-row">
        <button id="startButton" hidden>Start Exploration</button>
        <button id="resumeButton" hidden>Resume</button>
        <button id="closeRoomButton" class="secondary" hidden>Close Room</button>
        <button id="leaveRoomButton" class="secondary" hidden>Leave Room</button>
        <button id="restartButton" class="secondary" hidden>Restart</button>
      </div>
    </section>
    <section class="room-roster panel" id="roomRoster" hidden aria-label="Players in room">
      <strong>Players</strong>
      <div class="roster-list" id="roomRosterList"></div>
    </section>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
