<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ironhold Waves</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f4efe4;
      --muted: #b7ad9b;
      --panel: rgba(15, 18, 18, 0.74);
      --line: rgba(255, 255, 255, 0.14);
      --health: #d9433f;
      --guard: #53a6d8;
      --magica: #7ae8ff;
      --gold: #d5aa50;
      --dark: #0b0e0f;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #080a0a;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #hud {
      position: fixed;
      inset: 0;
      pointer-events: none;
      user-select: none;
    }

    .topbar {
      position: absolute;
      top: 16px;
      left: 16px;
      right: 16px;
      display: grid;
      grid-template-columns: minmax(230px, 360px) 1fr auto;
      align-items: start;
      gap: 14px;
    }

    .panel {
      background: linear-gradient(180deg, rgba(23, 27, 28, 0.82), rgba(12, 14, 15, 0.68));
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 18px 60px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(12px);
    }

    .status {
      padding: 12px;
      display: grid;
      gap: 10px;
    }

    .title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-width: 0;
    }

    .mark {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    .crest {
      width: 24px;
      height: 28px;
      flex: 0 0 auto;
      clip-path: polygon(50% 0, 92% 14%, 84% 74%, 50% 100%, 16% 74%, 8% 14%);
      background:
        linear-gradient(90deg, transparent 47%, rgba(255, 255, 255, 0.34) 48% 52%, transparent 53%),
        linear-gradient(135deg, #d5aa50 0 50%, #6f2f28 50% 100%);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.24);
    }

    .wave-pill {
      flex: 0 0 auto;
      min-width: 76px;
      text-align: center;
      color: #f7df9a;
      border: 1px solid rgba(213, 170, 80, 0.38);
      border-radius: 999px;
      padding: 4px 10px;
      background: rgba(213, 170, 80, 0.12);
      font-size: 12px;
      font-weight: 800;
    }

    .meter-group {
      display: grid;
      gap: 8px;
    }

    .meter-row {
      display: grid;
      grid-template-columns: 48px 1fr 42px;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .meter {
      height: 10px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.09);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08);
    }

    .meter > span {
      display: block;
      height: 100%;
      width: 100%;
      transform-origin: left center;
      border-radius: inherit;
      transition: transform 120ms linear;
    }

    #healthFill {
      background: linear-gradient(90deg, #8e2322, var(--health), #ff8272);
    }

    #guardFill {
      background: linear-gradient(90deg, #286b9b, var(--guard), #a8e9ff);
    }

    #hud.wizard-mode #guardFill {
      background: linear-gradient(90deg, #2e6b9f, var(--magica), #f6fbff);
    }

    #hud.wizard-mode .crest {
      background:
        radial-gradient(circle at 50% 35%, rgba(255, 255, 255, 0.7) 0 13%, transparent 14%),
        linear-gradient(135deg, #7ae8ff 0 48%, #274a78 49% 100%);
    }

    .rightbox {
      padding: 12px 14px;
      min-width: 170px;
      display: grid;
      gap: 8px;
      text-align: right;
    }

    .readout {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 14px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .readout strong {
      color: var(--ink);
      font-size: 15px;
    }

    #banner {
      justify-self: center;
      align-self: start;
      min-width: min(420px, 100%);
      padding: 12px 18px;
      opacity: 0;
      transform: translateY(-8px);
      text-align: center;
      color: #f7df9a;
      font-weight: 800;
      letter-spacing: 0;
      transition: opacity 180ms ease, transform 180ms ease;
    }

    #banner.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .reticle {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 20px;
      height: 20px;
      transform: translate(-50%, -50%);
      opacity: 0.42;
    }

    .reticle::before,
    .reticle::after {
      content: "";
      position: absolute;
      background: rgba(244, 239, 228, 0.78);
      border-radius: 999px;
    }

    .reticle::before {
      left: 9px;
      top: 2px;
      width: 2px;
      height: 16px;
    }

    .reticle::after {
      top: 9px;
      left: 2px;
      width: 16px;
      height: 2px;
    }

    .action-dock {
      position: absolute;
      left: 50%;
      bottom: 20px;
      display: flex;
      gap: 10px;
      transform: translateX(-50%);
    }

    .action {
      width: 78px;
      height: 64px;
      position: relative;
      padding: 7px 7px 6px;
      display: grid;
      grid-template-rows: 1fr auto;
      place-items: center;
      gap: 3px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(10, 12, 12, 0.62);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.04), 0 10px 28px rgba(0, 0, 0, 0.34);
      color: var(--ink);
    }

    .action svg {
      width: 28px;
      height: 28px;
      stroke: currentColor;
      stroke-width: 1.8;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .keybind {
      width: 100%;
      min-height: 14px;
      overflow: hidden;
      color: rgba(244, 239, 228, 0.76);
      font-size: 10px;
      font-weight: 900;
      line-height: 1.15;
      text-align: center;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .action.active {
      color: #f7df9a;
      border-color: rgba(213, 170, 80, 0.58);
      background: rgba(213, 170, 80, 0.18);
    }

    .action.ready {
      color: #7ae8ff;
      border-color: rgba(122, 232, 255, 0.58);
      background: rgba(57, 157, 194, 0.18);
    }

    .action[hidden] {
      display: none;
    }

    #overlay {
      position: fixed;
      inset: 0;
      z-index: 2;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 50% 35%, rgba(213, 170, 80, 0.22), transparent 34%),
        linear-gradient(180deg, rgba(3, 4, 4, 0.2), rgba(3, 4, 4, 0.82));
      color: var(--ink);
    }

    #overlay.hidden {
      display: none;
    }

    .start-card {
      width: min(620px, 100%);
      padding: 22px;
      text-align: center;
    }

    .start-card h1 {
      margin: 0 0 6px;
      font-size: clamp(34px, 7vw, 62px);
      line-height: 0.95;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    .start-card p {
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    .button-row {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .character-select {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin: 0 0 18px;
    }

    .character-card {
      min-height: 112px;
      padding: 14px;
      display: grid;
      align-content: center;
      justify-items: center;
      gap: 8px;
      background: rgba(15, 18, 18, 0.72);
      color: var(--ink);
      border-color: var(--line);
      box-shadow: none;
      text-transform: none;
    }

    .character-card strong {
      font-size: 18px;
      text-transform: uppercase;
    }

    .character-card span {
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    .class-glyph {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: rgba(255, 255, 255, 0.08);
    }

    .class-glyph svg {
      width: 25px;
      height: 25px;
      stroke: currentColor;
      stroke-width: 1.8;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .character-card.selected {
      color: #f7df9a;
      border-color: rgba(213, 170, 80, 0.66);
      background: rgba(213, 170, 80, 0.14);
    }

    .character-card[data-character="wizard"].selected {
      color: #7ae8ff;
      border-color: rgba(122, 232, 255, 0.66);
      background: rgba(57, 157, 194, 0.14);
    }

    .mode-select {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin: -8px 0 18px;
    }

    .mode-card {
      min-height: 70px;
      padding: 10px;
      display: grid;
      align-content: center;
      justify-items: center;
      gap: 5px;
      background: rgba(15, 18, 18, 0.72);
      color: var(--ink);
      border-color: var(--line);
      box-shadow: none;
      text-transform: none;
    }

    .mode-card strong {
      font-size: 13px;
      text-transform: uppercase;
    }

    .mode-card span {
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
    }

    .mode-card.selected {
      color: #f7df9a;
      border-color: rgba(213, 170, 80, 0.66);
      background: rgba(213, 170, 80, 0.14);
    }

    .online-panel {
      margin: -4px 0 18px;
      display: grid;
      gap: 8px;
    }

    .online-panel[hidden] {
      display: none;
    }

    .online-buttons,
    .online-footer {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .online-fields {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .signal-box {
      width: 100%;
      min-height: 70px;
      resize: vertical;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(8, 10, 10, 0.74);
      color: var(--ink);
      font: inherit;
      font-size: 11px;
      line-height: 1.35;
      padding: 8px;
      outline: none;
    }

    .signal-box:focus {
      border-color: rgba(122, 232, 255, 0.58);
    }

    .online-status {
      min-width: 118px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 900;
      text-align: left;
    }

    button {
      appearance: none;
      border: 1px solid rgba(213, 170, 80, 0.58);
      border-radius: 8px;
      background: linear-gradient(180deg, #dcb65e, #a56f28);
      color: #17100a;
      cursor: pointer;
      font: inherit;
      font-size: 14px;
      font-weight: 900;
      letter-spacing: 0;
      min-height: 44px;
      padding: 0 18px;
      text-transform: uppercase;
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.34), inset 0 1px 0 rgba(255, 255, 255, 0.36);
    }

    button.secondary {
      background: rgba(15, 18, 18, 0.72);
      color: var(--ink);
      border-color: var(--line);
      box-shadow: none;
    }

    #touchControls {
      position: absolute;
      inset: auto 16px 16px 16px;
      display: none;
      justify-content: space-between;
      align-items: end;
      pointer-events: none;
    }

    .touch-pad,
    .touch-actions {
      pointer-events: auto;
      display: grid;
      gap: 10px;
    }

    .touch-pad {
      grid-template-columns: repeat(3, 46px);
      grid-template-rows: repeat(3, 46px);
    }

    .touch-pad button,
    .touch-actions button {
      min-width: 46px;
      min-height: 46px;
      padding: 0;
      background: rgba(10, 12, 12, 0.62);
      color: var(--ink);
      border-color: var(--line);
    }

    .touch-pad .up { grid-column: 2; grid-row: 1; }
    .touch-pad .left { grid-column: 1; grid-row: 2; }
    .touch-pad .down { grid-column: 2; grid-row: 3; }
    .touch-pad .right { grid-column: 3; grid-row: 2; }
    .touch-actions { grid-auto-flow: column; }

    @media (max-width: 720px) {
      .topbar {
        grid-template-columns: 1fr;
      }

      #banner,
      .rightbox {
        justify-self: stretch;
        text-align: left;
      }

      .rightbox {
        grid-template-columns: repeat(3, 1fr);
        min-width: 0;
      }

      .readout {
        display: grid;
        gap: 2px;
      }

      .action-dock {
        display: none;
      }

      #touchControls {
        display: flex;
      }

      .character-select {
        grid-template-columns: 1fr;
      }

      .mode-select,
      .online-fields {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div id="game"></div>

  <div id="hud" aria-live="polite">
    <div class="topbar">
      <section class="status panel" id="statusPanel" aria-label="Knight status">
        <div class="title-row">
          <div class="mark"><span class="crest"></span><span id="classLabel">Knight</span></div>
          <div class="wave-pill" id="waveLabel">Wave 1</div>
        </div>
        <div class="meter-group">
          <div class="meter-row">
            <span>HP</span>
            <div class="meter"><span id="healthFill"></span></div>
            <span id="healthText">100</span>
          </div>
          <div class="meter-row">
            <span id="resourceLabel">Guard</span>
            <div class="meter"><span id="guardFill"></span></div>
            <span id="guardText">100</span>
          </div>
        </div>
      </section>

      <div id="banner" class="panel"></div>

      <section class="rightbox panel" aria-label="Battle status">
        <div class="readout"><span>Enemies</span><strong id="enemyText">0</strong></div>
        <div class="readout"><span>KOs</span><strong id="koText">0</strong></div>
        <div class="readout"><span>Threat</span><strong id="threatText">Low</strong></div>
      </section>
    </div>

    <div class="reticle"></div>

    <div class="action-dock" aria-hidden="true">
      <div class="action" id="attackIcon">
        <svg viewBox="0 0 32 32"><path d="M22 4l6 6M18 8l6 6M4 28l6-2 15-15-4-4L6 22zM6 22l4 4"/></svg>
        <span class="keybind">LMB / Space</span>
      </div>
      <div class="action" id="blockIcon">
        <svg viewBox="0 0 32 32"><path d="M16 3l10 4v7c0 7-4 12-10 15C10 26 6 21 6 14V7z"/><path d="M16 7v17"/></svg>
        <span class="keybind">RMB / K</span>
      </div>
      <div class="action" id="potionIcon" hidden>
        <svg viewBox="0 0 32 32"><path d="M12 3h8M14 3v7l-5 8a7 7 0 0 0 6 11h2a7 7 0 0 0 6-11l-5-8V3"/><path d="M10 21h12"/></svg>
        <span class="keybind">MMB / H</span>
      </div>
    </div>

    <div id="touchControls">
      <div class="touch-pad">
        <button class="up" data-touch-key="KeyW" aria-label="Forward">^</button>
        <button class="left" data-touch-key="KeyA" aria-label="Left">&lt;</button>
        <button class="right" data-touch-key="KeyD" aria-label="Right">&gt;</button>
        <button class="down" data-touch-key="KeyS" aria-label="Back">v</button>
      </div>
      <div class="touch-actions">
        <button data-touch-action="attack" aria-label="Attack">A</button>
        <button data-touch-action="block" aria-label="Block">B</button>
        <button data-touch-action="potion" aria-label="Potion" hidden>P</button>
      </div>
    </div>
  </div>

  <div id="overlay">
    <section class="start-card panel">
      <h1>Ironhold Waves</h1>
      <p id="overlayCopy">The north gate has fallen. Hold the ring until the last raider drops.</p>
      <div class="character-select" role="radiogroup" aria-label="Choose character">
        <button class="character-card selected" type="button" data-character="knight" role="radio" aria-checked="true">
          <span class="class-glyph"><svg viewBox="0 0 32 32"><path d="M16 3l10 4v7c0 7-4 12-10 15C10 26 6 21 6 14V7z"/><path d="M16 7v17"/></svg></span>
          <strong>Knight</strong>
          <span>Blade and guard</span>
        </button>
        <button class="character-card" type="button" data-character="wizard" role="radio" aria-checked="false">
          <span class="class-glyph"><svg viewBox="0 0 32 32"><path d="M17 2L7 17h7l-2 13 12-17h-8z"/></svg></span>
          <strong>Wizard</strong>
          <span>Storm and potions</span>
        </button>
      </div>
      <div class="mode-select" role="radiogroup" aria-label="Choose game mode">
        <button class="mode-card selected" type="button" data-mode="solo" role="radio" aria-checked="true">
          <strong>Solo</strong>
          <span>Waves</span>
        </button>
        <button class="mode-card" type="button" data-mode="ffa" role="radio" aria-checked="false">
          <strong>Free For All</strong>
          <span>Duel</span>
        </button>
        <button class="mode-card" type="button" data-mode="coop" role="radio" aria-checked="false">
          <strong>Co-op</strong>
          <span>Waves</span>
        </button>
      </div>
      <div class="online-panel" id="onlinePanel" hidden>
        <div class="online-buttons">
          <button id="hostButton" class="secondary" type="button">Host</button>
          <button id="joinButton" class="secondary" type="button">Join</button>
          <button id="copySignalButton" class="secondary" type="button">Copy Code</button>
        </div>
        <div class="online-fields">
          <textarea class="signal-box" id="localSignal" readonly aria-label="Local connection code" placeholder="Local code"></textarea>
          <textarea class="signal-box" id="remoteSignal" aria-label="Remote connection code" placeholder="Remote code"></textarea>
        </div>
        <div class="online-footer">
          <button id="connectSignalButton" class="secondary" type="button">Connect</button>
          <span class="online-status" id="onlineStatus">Offline</span>
        </div>
      </div>
      <div class="button-row">
        <button id="startButton">Start as Knight</button>
        <button id="restartButton" class="secondary" hidden>Restart</button>
      </div>
    </section>
  </div>

  <script type="module">
    import * as THREE from "https://unpkg.com/three@0.160.0/build/three.module.js";

    (() => {
      "use strict";
      try {

      const root = document.getElementById("game");
      const hud = document.getElementById("hud");
      const overlay = document.getElementById("overlay");
      const overlayCopy = document.getElementById("overlayCopy");
      const startButton = document.getElementById("startButton");
      const restartButton = document.getElementById("restartButton");
      const statusPanel = document.getElementById("statusPanel");
      const classLabel = document.getElementById("classLabel");
      const waveLabel = document.getElementById("waveLabel");
      const healthFill = document.getElementById("healthFill");
      const guardFill = document.getElementById("guardFill");
      const healthText = document.getElementById("healthText");
      const resourceLabel = document.getElementById("resourceLabel");
      const guardText = document.getElementById("guardText");
      const enemyText = document.getElementById("enemyText");
      const koText = document.getElementById("koText");
      const threatText = document.getElementById("threatText");
      const attackIcon = document.getElementById("attackIcon");
      const blockIcon = document.getElementById("blockIcon");
      const potionIcon = document.getElementById("potionIcon");
      const banner = document.getElementById("banner");
      const characterCards = Array.from(document.querySelectorAll("[data-character]"));
      const modeCards = Array.from(document.querySelectorAll("[data-mode]"));
      const onlinePanel = document.getElementById("onlinePanel");
      const hostButton = document.getElementById("hostButton");
      const joinButton = document.getElementById("joinButton");
      const copySignalButton = document.getElementById("copySignalButton");
      const connectSignalButton = document.getElementById("connectSignalButton");
      const localSignal = document.getElementById("localSignal");
      const remoteSignal = document.getElementById("remoteSignal");
      const onlineStatus = document.getElementById("onlineStatus");
      const secondaryTouchButton = document.querySelector("[data-touch-action='block']");
      const potionTouchButton = document.querySelector("[data-touch-action='potion']");

      if (!THREE) {
        overlayCopy.textContent = "The 3D renderer could not be loaded.";
        startButton.hidden = true;
        return;
      }

      const TAU = Math.PI * 2;
      const arenaRadius = 25;
      const tmpVec = new THREE.Vector3();
      const tmpVec2 = new THREE.Vector3();
      const up = new THREE.Vector3(0, 1, 0);
      const clock = new THREE.Clock();
      const keys = new Set();

      const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.7));
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.05;
      root.appendChild(renderer.domElement);

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x82bee8);
      scene.fog = new THREE.FogExp2(0x9ac7e8, 0.018);

      const camera = new THREE.PerspectiveCamera(58, window.innerWidth / window.innerHeight, 0.1, 140);
      camera.position.set(0, 6, 10);

      const materials = {
        grass: new THREE.MeshStandardMaterial({ color: 0x394736, roughness: 0.92 }),
        dirt: new THREE.MeshStandardMaterial({ color: 0x6a5740, roughness: 0.98 }),
        stone: new THREE.MeshStandardMaterial({ color: 0x646865, roughness: 0.88, metalness: 0.02 }),
        darkStone: new THREE.MeshStandardMaterial({ color: 0x3e4544, roughness: 0.94 }),
        steel: new THREE.MeshStandardMaterial({ color: 0xbfc8c5, metalness: 0.82, roughness: 0.34 }),

      function clamp(value, min, max) {
        return Math.max(min, Math.min(max, value));
      }

      function lerp(a, b, t) {
        return a + (b - a) * t;
      }

      function smoothstep(edge0, edge1, x) {
        const t = clamp((x - edge0) / (edge1 - edge0), 0, 1);
        return t * t * (3 - 2 * t);
      }

      function addShadow(mesh) {
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        return mesh;
      }

      function makeBox(width, height, depth, material, x, y, z) {
        const mesh = new THREE.Mesh(new THREE.BoxGeometry(width, height, depth), material);
        mesh.position.set(x || 0, y || 0, z || 0);
        return addShadow(mesh);
      }

      function makeCylinder(radiusTop, radiusBottom, height, radialSegments, material, x, y, z) {
        const mesh = new THREE.Mesh(
          new THREE.CylinderGeometry(radiusTop, radiusBottom, height, radialSegments || 16),
          material
        );
        mesh.position.set(x || 0, y || 0, z || 0);
        return addShadow(mesh);
      }

      function makeSphere(radius, material, x, y, z) {
        const mesh = new THREE.Mesh(new THREE.SphereGeometry(radius, 20, 14), material);
        mesh.position.set(x || 0, y || 0, z || 0);
        return addShadow(mesh);
      }

      function makeGroundTexture() {
        const canvas = document.createElement("canvas");
        canvas.width = 256;
        canvas.height = 256;
        const ctx = canvas.getContext("2d");
        ctx.fillStyle = "#3b4436";
        ctx.fillRect(0, 0, 256, 256);
        for (let i = 0; i < 900; i += 1) {
          const x = Math.random() * 256;
          const y = Math.random() * 256;
          const r = 1 + Math.random() * 4;
          ctx.fillStyle = Math.random() > 0.55 ? "rgba(115, 98, 67, 0.28)" : "rgba(24, 32, 24, 0.24)";
          ctx.beginPath();
          ctx.arc(x, y, r, 0, TAU);
          ctx.fill();
        }
        for (let i = 0; i < 18; i += 1) {
          ctx.strokeStyle = "rgba(174, 144, 91, 0.18)";
          ctx.lineWidth = 1 + Math.random() * 2;
          ctx.beginPath();
          ctx.moveTo(Math.random() * 256, Math.random() * 256);
          ctx.bezierCurveTo(Math.random() * 256, Math.random() * 256, Math.random() * 256, Math.random() * 256, Math.random() * 256, Math.random() * 256);
          ctx.stroke();
        }
        const texture = new THREE.CanvasTexture(canvas);
        texture.colorSpace = THREE.SRGBColorSpace;
        texture.wrapS = THREE.RepeatWrapping;
        texture.wrapT = THREE.RepeatWrapping;
        texture.repeat.set(7, 7);
        return texture;
      }

      function createCloud(x, y, z, scale) {
        const cloud = new THREE.Group();
        cloud.position.set(x, y, z);
        const puffPositions = [
          [-1.2, 0, 0, 1.15],
          [-0.35, 0.2, 0.05, 1.35],
          [0.72, 0.08, 0, 1.05],
          [1.45, -0.03, 0.02, 0.82],
          [0.12, -0.14, 0.15, 0.95]
        ];
        for (const [px, py, pz, puffScale] of puffPositions) {
          const puff = new THREE.Mesh(new THREE.SphereGeometry(0.95 * puffScale * scale, 14, 10), materials.cloud);
          puff.position.set(px * scale, py * scale, pz * scale);
          puff.scale.y = 0.55;
          cloud.add(puff);
        }
        cloud.rotation.y = Math.random() * TAU;
        scene.add(cloud);
      }

      function createSpectator(x, y, z, angle, material, cheerPhase) {
        const spectator = new THREE.Group();
        spectator.position.set(x, y, z);
        spectator.rotation.y = angle;
        const body = makeCylinder(0.11, 0.13, 0.34, 8, material, 0, 0.18, 0);
        const head = makeSphere(0.095, materials.skin, 0, 0.43, 0);

        const rightArm = makeBox(0.045, 0.24, 0.045, materials.skin, 0.13, 0.28, 0);
        leftArm.rotation.z = -0.35 - Math.sin(cheerPhase) * 0.45;
        rightArm.rotation.z = 0.35 + Math.cos(cheerPhase) * 0.45;
        spectator.add(body, head, leftArm, rightArm);
        scene.add(spectator);
      }

      function setupGrandstands() {
        const crowdMaterials = [materials.crowdRed, materials.crowdBlue, materials.crowdGreen, materials.crowdGold, materials.leather];
        const sections = 16;
        for (let section = 0; section < sections; section += 1) {
          const angle = (section / sections) * TAU + Math.PI / sections;
          const centerRadius = 41.5;
          const x = Math.cos(angle) * centerRadius;
          const z = Math.sin(angle) * centerRadius;
          const stand = new THREE.Group();
          stand.position.set(x, 0, z);
          stand.rotation.y = -angle + Math.PI / 2;

          const lowerWall = makeBox(12.6, 1.35, 0.5, materials.stone, 0, 0.68, -2.8);
          const concourse = makeBox(12.8, 0.55, 6.4, materials.darkStone, 0, 0.28, 0.15);
          const rearWall = makeBox(12.8, 2.4, 0.52, materials.stone, 0, 2.1, 3.18);
          stand.add(concourse, lowerWall, rearWall);

          for (let arch = 0; arch < 4; arch += 1) {
            const archX = -4.8 + arch * 3.2;
            const leftColumn = makeBox(0.28, 1.42, 0.62, materials.darkStone, archX - 0.74, 0.72, -3.12);
            const rightColumn = makeBox(0.28, 1.42, 0.62, materials.darkStone, archX + 0.74, 0.72, -3.12);
            const archTop = makeBox(1.78, 0.34, 0.64, materials.darkStone, archX, 1.31, -3.14);
            const shadowGap = makeBox(1.1, 0.88, 0.045, materials.fur, archX, 0.66, -3.47);
            stand.add(leftColumn, rightColumn, archTop, shadowGap);
          }

          for (let row = 0; row < 5; row += 1) {
            const y = 0.82 + row * 0.45;
            const zRow = -1.65 + row * 0.82;
            const bench = makeBox(12.2 - row * 0.35, 0.2, 0.38, row % 2 ? materials.paleWood : materials.wood, 0, y, zRow);
            const riser = makeBox(12.35 - row * 0.35, 0.5, 0.3, materials.stone, 0, y - 0.18, zRow + 0.28);
            stand.add(bench, riser);
          }

          for (let merlon = 0; merlon < 7; merlon += 1) {
            const block = makeBox(0.72, 0.58, 0.42, materials.stone, -5.1 + merlon * 1.7, 3.58, 3.15);
            stand.add(block);
          }

          for (let col = 0; col < 11; col += 1) {
            for (let row = 0; row < 5; row += 1) {
              if ((col + row + section) % 6 === 0) {
                continue;
              }
              const lx = -5.0 + col;
              const lz = -1.72 + row * 0.82;
              const local = new THREE.Vector3(lx, 1.02 + row * 0.45, lz);
              local.applyAxisAngle(up, stand.rotation.y);
              const material = crowdMaterials[(col + row + section) % crowdMaterials.length];
              createSpectator(x + local.x, local.y, z + local.z, stand.rotation.y + Math.PI, material, section + col * 0.7 + row);
            }
          }

          scene.add(stand);
        }
      }

      function updateOnlineStatus(text) {
        onlineStatus.textContent = text;
      }

      function encodeSignal(description) {
        return btoa(JSON.stringify(description));
      }

      function decodeSignal(value) {
        return JSON.parse(atob(value.trim()));
      }

      function waitForIceGathering(pc) {
        if (pc.iceGatheringState === "complete") {
          return Promise.resolve();
        }
        return new Promise(resolve => {
          const timeout = window.setTimeout(done, 2600);
          function done() {
            window.clearTimeout(timeout);
            pc.removeEventListener("icegatheringstatechange", check);
            resolve();
          }
          function check() {
            if (pc.iceGatheringState === "complete") {
              done();
            }
          }
          pc.addEventListener("icegatheringstatechange", check);
        });
      }

      function closeOnlineConnection(removeRemotes = true, clearSignals = true) {
        if (online.channel) {
          online.channel.close();
        }
        if (online.pc) {
          online.pc.close();
        }
        online.pc = null;
        online.channel = null;
        online.connected = false;
        online.role = null;
        if (removeRemotes) {
          for (const remote of online.remotePlayers.values()) {
            scene.remove(remote.group);
          }
          online.remotePlayers.clear();
        }
        if (clearSignals) {
          localSignal.value = "";
          remoteSignal.value = "";
        }
        updateOnlineStatus(game.mode === "solo" ? "Offline" : "Not connected");
      }

      function setupPeerConnection() {
        closeOnlineConnection(false, false);
        const pc = new RTCPeerConnection({
          iceServers: [{ urls: "stun:stun.l.google.com:19302" }]
        });
        online.pc = pc;
        pc.ondatachannel = event => setupDataChannel(event.channel);
        pc.onconnectionstatechange = () => {
          const state = pc.connectionState;
          online.connected = state === "connected";
          updateOnlineStatus(online.connected ? "Connected" : state.charAt(0).toUpperCase() + state.slice(1));
        };
        pc.oniceconnectionstatechange = () => {
          if (!online.connected) {
            updateOnlineStatus(pc.iceConnectionState.charAt(0).toUpperCase() + pc.iceConnectionState.slice(1));
          }
        };
        return pc;
      }

      function setupDataChannel(channel) {
        online.channel = channel;
        channel.onopen = () => {
          online.connected = true;
          updateOnlineStatus("Connected");
          sendOnlineMessage({ kind: "state", state: serializePlayerState() });
        };
        channel.onclose = () => {
          online.connected = false;
          updateOnlineStatus("Closed");
        };
        channel.onerror = () => updateOnlineStatus("Channel error");
        channel.onmessage = event => handleOnlineMessage(event.data);
      }

      async function hostOnlineGame() {
        if (game.mode === "solo") {
          setGameMode("ffa");
        }
        const pc = setupPeerConnection();
        online.role = "host";
        setupDataChannel(pc.createDataChannel("ironhold"));
        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);
        await waitForIceGathering(pc);
        localSignal.value = encodeSignal(pc.localDescription);
        updateOnlineStatus("Host code ready");
      }

      async function joinOnlineGame() {
        if (!remoteSignal.value.trim()) {
          updateOnlineStatus("Need host code");
          return;
        }
        const pc = setupPeerConnection();
        online.role = "join";
        await pc.setRemoteDescription(decodeSignal(remoteSignal.value));
        const answer = await pc.createAnswer();
        await pc.setLocalDescription(answer);
        await waitForIceGathering(pc);
        localSignal.value = encodeSignal(pc.localDescription);
        updateOnlineStatus("Answer ready");
      }

      async function connectOnlineAnswer() {
        if (!online.pc || online.role !== "host") {
          await joinOnlineGame();
          return;
        }
        if (!remoteSignal.value.trim()) {
          updateOnlineStatus("Need answer");
          return;
        }
        await online.pc.setRemoteDescription(decodeSignal(remoteSignal.value));
        updateOnlineStatus("Connecting");
      }

      async function copyLocalSignal() {
        if (!localSignal.value.trim()) {
          updateOnlineStatus("No code");
          return;
        }
        try {
          await navigator.clipboard.writeText(localSignal.value);
          updateOnlineStatus("Code copied");
        } catch (error) {
          localSignal.select();
          updateOnlineStatus("Select code");
        }
      }

      function serializePlayerState() {
        return {
          id: online.localId,
          mode: game.mode,
          character: player.character,
          health: player.health,
          maxHealth: player.maxHealth,
          x: player.position.x,
          z: player.position.z,
          yaw: player.yaw
        };
      }

      function sendOnlineMessage(message) {
        if (!online.channel || online.channel.readyState !== "open") {
          return;
        }
        online.channel.send(JSON.stringify({
          ...message,
          id: online.localId,
          mode: game.mode
        }));
      }

      function sendOnlineAction(action) {
        if (game.mode === "solo") {
          return;
        }
        sendOnlineMessage({
          kind: "action",
          action,
          state: serializePlayerState()
        });
      }

      function handleOnlineMessage(raw) {
        let message;
        try {
          message = JSON.parse(raw);
        } catch (error) {
          return;
        }
        if (!message || message.id === online.localId) {
          return;
        }
        if (message.state) {
          upsertRemotePlayer(message.state);
        }
        if (message.kind === "state" && !message.state) {
          upsertRemotePlayer(message);
        }
        if (message.kind === "action" && message.state) {
          applyRemoteAction(message.action, message.state);
        }
      }

      function upsertRemotePlayer(state) {
        let remote = online.remotePlayers.get(state.id);
        if (!remote) {
          remote = createRemotePlayerModel(state.character || "knight");
          online.remotePlayers.set(state.id, remote);
          remote.group.position.set(state.x || 0, 0, state.z || 0);
          remote.targetPosition.copy(remote.group.position);
        }
        remote.character = state.character || remote.character || "knight";
        remote.health = state.health ?? remote.health;
        remote.maxHealth = state.maxHealth ?? remote.maxHealth;
        remote.targetPosition.set(state.x || 0, 0, state.z || 0);
        remote.targetYaw = state.yaw || 0;
        remote.lastSeen = clock.elapsedTime;
      }

      function updateRemotePlayers(dt) {
        for (const [id, remote] of online.remotePlayers) {
          const before = remote.group.position.clone();
          remote.group.position.lerp(remote.targetPosition, 1 - Math.pow(0.0002, dt));
          remote.group.rotation.y = lerp(remote.group.rotation.y, remote.targetYaw || 0, 1 - Math.pow(0.00005, dt));
          const moved = remote.group.position.distanceTo(before);
          remote.walkTime += moved * 2.8;
          const swing = Math.sin(remote.walkTime * 7.2) * Math.min(0.28, moved * 8);
          if (remote.leftLeg && remote.rightLeg) {
            remote.leftLeg.rotation.x = swing;
            remote.rightLeg.rotation.x = -swing;
          }
          remote.marker.rotation.z += dt * 0.9;
          if (clock.elapsedTime - (remote.lastSeen || 0) > 12) {
            scene.remove(remote.group);
            online.remotePlayers.delete(id);
          }
        }
      }

      function updateOnline(dt) {
        if (game.mode === "solo") {
          return;
        }
        online.sendTimer -= dt;
        if (online.sendTimer <= 0) {
          online.sendTimer = 0.08;
          sendOnlineMessage({ kind: "state", state: serializePlayerState() });
        }
        updateRemotePlayers(dt);
      }

      function pointInAttackCone(source, yaw, target, range, minDot) {
        const forward = forwardFromYaw(yaw, new THREE.Vector3());
        const toTarget = target.clone().sub(source);
        const distance = toTarget.length();
        if (distance > range || distance < 0.001) {
          return false;
        }
        toTarget.y = 0;
        toTarget.normalize();
        return forward.dot(toTarget) >= minDot;
      }

      function applyRemoteAction(action, state) {
        const source = new THREE.Vector3(state.x || 0, 0, state.z || 0);
        const forward = forwardFromYaw(state.yaw || 0, new THREE.Vector3());
        spawnImpact(source, game.mode === "coop" ? 0x7ae8ff : 0xff705c, action === "burst" ? 18 : 10);

        if (game.mode === "coop") {
          applyRemoteActionToEnemies(action, source, state.yaw || 0, forward);
        } else if (game.mode === "ffa") {
          applyRemoteActionToPlayer(action, source, state.yaw || 0, forward);
        }
      }

      function applyRemoteActionToEnemies(action, source, yaw, forward) {
        if (action === "burst") {
          for (const enemy of game.enemies) {
            if (!enemy.dead && enemy.position.distanceTo(source) < 3.45 + enemy.radius) {
              const direction = enemy.position.clone().sub(source).normalize();
              damageEnemy(enemy, 20, direction, 0.55);
            }
          }
          return;
        }

        let best = null;
        let bestDistance = Infinity;
        const range = action === "lightning" ? 14.5 : 2.7;
        const minDot = action === "lightning" ? 0.34 : 0.18;
        for (const enemy of game.enemies) {
          if (enemy.dead || !pointInAttackCone(source, yaw, enemy.position.clone(), range + enemy.radius, minDot)) {
            continue;
          }
          const distance = enemy.position.distanceTo(source);
          if (distance < bestDistance) {
            bestDistance = distance;
            best = enemy;
          }
        }
        if (best) {
          damageEnemy(best, action === "lightning" ? 30 : 28, forward, action === "lightning" ? 0.35 : 0.42);
        }
      }

      function applyRemoteActionToPlayer(action, source, yaw, forward) {
        if (player.health <= 0) {
          return;
        }
        let hit = false;
        if (action === "burst") {
          hit = player.position.distanceTo(source) < 3.35;
        } else {
          hit = pointInAttackCone(source, yaw, player.position.clone(), action === "lightning" ? 14.0 : 2.7, action === "lightning" ? 0.55 : 0.18);
        }
        if (!hit) {
          return;
        }
        const damage = action === "lightning" ? 22 : action === "burst" ? 18 : 24;
        applyPlayerDamage(damage, damage + 12, forward, action === "burst" ? 0.18 : 0.08);
      }

      function getGateEntrance(index, type) {
        if (!game.gates.length) {
          const angle = (index / 4) * TAU;
          return {
            startX: Math.cos(angle) * (arenaRadius - 1.5),
            startZ: Math.sin(angle) * (arenaRadius - 1.5),
            targetX: Math.cos(angle) * (arenaRadius - 7.5),
            targetZ: Math.sin(angle) * (arenaRadius - 7.5)
          };
        }

        const gate = game.gates[index % game.gates.length];
        const lane = Math.floor(index / game.gates.length);
        const laneOffset = ((lane % 4) - 1.5) * (type === "dragon" ? 0.9 : 0.72);
        const tangent = tmpVec.set(Math.cos(gate.angle + Math.PI / 2), 0, Math.sin(gate.angle + Math.PI / 2));
        const startRadius = gate.startRadius + (type === "dragon" ? 1.2 : 0) + Math.floor(lane / 4) * 1.1;
        const targetRadius = gate.targetRadius - (type === "dragon" ? 0.8 : 0) - Math.floor(lane / 4) * 0.55;
        return {
          startX: Math.cos(gate.angle) * startRadius + tangent.x * laneOffset,
          startZ: Math.sin(gate.angle) * startRadius + tangent.z * laneOffset,
          targetX: Math.cos(gate.angle) * targetRadius + tangent.x * laneOffset,
          targetZ: Math.sin(gate.angle) * targetRadius + tangent.z * laneOffset
        };
      }

      function setEnemyEntrance(enemy, entrance, delay) {
        enemy.entering = true;
        enemy.entryDelay = delay;
        enemy.entryTarget = new THREE.Vector3(entrance.targetX, 0, entrance.targetZ);
        enemy.state = "entering";
        enemy.cooldown = Math.max(enemy.cooldown, delay + 0.8);
        const entryDirection = tmpVec.copy(enemy.entryTarget).sub(enemy.position);
        if (entryDirection.lengthSq() > 0.0001) {
          enemy.yaw = yawFromDirection(entryDirection.normalize());
          enemy.group.rotation.y = enemy.yaw;
        }
      }

      function spawnWave() {
        game.wave += 1;
        game.nextWaveIn = 0;
        const count = Math.min(5 + Math.floor(game.wave * 1.6), 18);
        const dragonCount = Math.min(Math.max(1, Math.floor(game.wave / 2)), Math.floor(count * 0.38));
        for (let i = 0; i < count; i += 1) {
          const entrance = getGateEntrance(i, i < dragonCount ? "dragon" : "barbarian");
          const delay = (i % 4) * 0.18 + Math.floor(i / 4) * 0.32;
          if (i < dragonCount) {
            const dragon = createDragon(entrance.startX, entrance.startZ, game.wave);
            setEnemyEntrance(dragon, entrance, delay);
            game.enemies.push(dragon);
          } else {
            const offset = i - dragonCount;
            const barbarian = createBarbarian(entrance.startX, entrance.startZ, game.wave);
            setEnemyEntrance(barbarian, entrance, delay + offset * 0.05);
            game.enemies.push(barbarian);
          }
        }
        showBanner("Wave " + game.wave + " entering");
      }

      function updateEnemyEntrance(enemy, dt) {
        enemy.entryDelay = Math.max(0, enemy.entryDelay - dt);
        if (enemy.telegraph) {
          enemy.telegraph.visible = false;
        }

        if (enemy.entryDelay > 0) {
          enemy.velocity.multiplyScalar(Math.pow(0.05, dt));
          return;
        }

        const toTarget = tmpVec2.copy(enemy.entryTarget).sub(enemy.position);
        const distance = toTarget.length();
        if (distance < 0.45) {
          enemy.entering = false;
          enemy.state = "chase";
          enemy.entryTarget = null;
          enemy.cooldown = Math.max(enemy.cooldown, 0.7 + Math.random() * 0.45);
          enemy.velocity.multiplyScalar(0.35);
          return;
        }

        const direction = toTarget.multiplyScalar(1 / Math.max(distance, 0.001));
        const speed = enemy.speed * (enemy.type === "dragon" ? 1.15 : 1.32);
        enemy.yaw = yawFromDirection(direction);
        enemy.velocity.x = lerp(enemy.velocity.x, direction.x * speed, 1 - Math.pow(0.01, dt));
        enemy.velocity.z = lerp(enemy.velocity.z, direction.z * speed, 1 - Math.pow(0.01, dt));
        if (enemy.type === "barbarian") {
          enemy.walkTime += dt * speed;
        }
      }

      function resetGame() {
        for (const enemy of game.enemies) {
          scene.remove(enemy.group);
        }
        for (const fireball of game.fireballs) {
          scene.remove(fireball.group);
        }
        for (const projectile of game.playerProjectiles) {
          scene.remove(projectile.group);
        }
        for (const potion of game.potions) {
          scene.remove(potion.group);
        }
        for (const particle of game.particles) {
          scene.remove(particle.mesh);
        }
        game.enemies.length = 0;
        game.fireballs.length = 0;
        game.playerProjectiles.length = 0;
        game.potions.length = 0;
        game.particles.length = 0;
        game.wave = 0;
        game.kills = 0;
        game.nextWaveIn = 0;
        game.state = "playing";
        game.cameraYaw = 0;
        game.startedOnce = true;
        player.position.set(0, 0, 0);
        player.velocity.set(0, 0, 0);
        player.yaw = 0;
        setPlayerCharacter(game.selectedCharacter, true);
        player.hurtTimer = 0;
        player.group.position.copy(player.position);
        player.group.rotation.y = 0;
        overlay.classList.add("hidden");
        startButton.hidden = false;
        restartButton.hidden = true;
        if (game.mode === "ffa") {
          showBanner("Free for all");
        } else {
          spawnWave();
        }
        sendOnlineMessage({ kind: "state", state: serializePlayerState() });
        updateHud();
      }
